spring.application.name=EMPLOYEE-SERVICE
server.port=8081
# ===============================
# Database Configuration
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/EmployeeManagementSystem
spring.datasource.username=postgres
spring.datasource.password=postgres

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true



resilience4j.retry.instances.departmentService.max-attempts=3
resilience4j.retry.instances.departmentService.wait-duration=1s

resilience4j.retry.instances.departmentService.enable-exponential-backoff=true
resilience4j.retry.instances.departmentService.exponential-backoff-multiplier=2



resilience4j.circuitbreaker.instances.departmentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=10

resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.departmentService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.departmentService.automatic-transition-from-open-to-half-open-enabled=true




spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer